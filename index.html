<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>𝙆𝙚𝙟𝙟</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#121212; --surface:#1e1e1e; --surface2:#2a2a2a; --text:#e0e0e0; --muted:#a0a0a0; --accent:#bb86fc; --border:#333;
  --user-msg:#bb86fc; --user-msg-text:#000000; --bot-msg:#1e1e1e; --bot-msg-text:#e0e0e0; --input-bg:#1e1e1e; --input-text:#e0e0e0; --btn-bg:#bb86fc; --btn-text:#000000; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;flex-direction:column;padding:16px;overflow-y:auto}
.screen.active{display:flex}
input,textarea,select,button{font-family:inherit}
.search-bar{width:100%;padding:12px 16px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--input-text);font-size:16px;margin-bottom:16px;outline:none}
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.folder-card{background:var(--surface);border-radius:var(--radius);padding:16px;border-left:4px solid var(--accent);cursor:pointer}
.folder-card:hover{background:var(--surface2)}
.folder-name{font-weight:600;margin-bottom:4px}
.folder-count{font-size:12px;color:var(--muted)}
.role-list{display:flex;flex-direction:column;gap:8px}
.role-item{background:var(--surface);border-radius:var(--radius);padding:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.role-item:hover{background:var(--surface2)}
.btn{background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:var(--radius);padding:12px 20px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;}
.btn:active{opacity:0.8}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-small{padding:8px 14px;font-size:14px}
.header-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.header-bar h1{flex:1;font-size:24px; letter-spacing: 1px;}
.header-bar h2{flex:1;font-size:20px}

.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;padding:4px}
.msg-container{display:flex;flex-direction:column;max-width:85%;position:relative}
.msg-container.user{align-self:flex-end;align-items:flex-end}
.msg-container.bot{align-self:flex-start;align-items:flex-start}
.msg{padding:12px 16px;border-radius:var(--radius);line-height:1.4;white-space:pre-wrap;word-wrap:break-word;width:100%}
.msg.bot{background:var(--bot-msg);color:var(--bot-msg-text);border-bottom-left-radius:4px}
.msg.user{background:var(--user-msg);color:var(--user-msg-text);border-bottom-right-radius:4px}
.msg-actions{display:flex;gap:8px;margin-top:4px;font-size:12px;opacity:0.6;}
.msg-actions button{background:none;border:none;color:var(--text);cursor:pointer;padding:4px;font-size:14px}
.msg-actions button:active{opacity:1}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;padding:14px 16px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--input-text);font-size:16px;resize:none;outline:none;min-height:52px;max-height:120px}
.notes-panel{background:var(--surface2);border-radius:var(--radius);padding:16px;margin-top:12px;font-size:14px}
.notes-panel textarea{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;color:var(--input-text);padding:12px;font-size:14px;min-height:120px;resize:vertical;margin-top:8px;outline:none}
.hidden{display:none!important}
.form-group{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:14px;color:var(--muted)}
.form-group input,.form-group textarea,.form-group select{background:var(--input-bg);border:1px solid var(--border);border-radius:12px;color:var(--input-text);padding:12px;font-size:15px;outline:none}
.settings-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.model-switch{display:flex;gap:8px;margin-bottom:12px}
.model-switch button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;cursor:pointer}
.model-switch button.selected{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg);font-weight:700}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.color-row label{font-size:14px;color:var(--text)}
.color-row input[type=color]{width:56px;height:40px;border:none;border-radius:10px;background:none;cursor:pointer}
.switch-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.switch-row label{font-size:14px}
.switch-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}

/* Модальные окна */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(2px)}
.modal-content{background:var(--surface);border-radius:var(--radius);padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,0.5);max-height: 90vh; overflow-y: auto;}
.modal-content h3{text-align:center;margin-bottom:8px;font-size:18px}
.modal-content button{padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;cursor:pointer;text-align:left;transition:0.2s}
.modal-content button:active{background:var(--btn-bg);color:var(--btn-text)}
.modal-content textarea{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:12px;color:var(--input-text);padding:12px;font-size:15px;min-height:120px;resize:vertical;outline:none;}

/* Кастомные радио-кнопки для характера */
.radio-group{display:flex; flex-direction:column; gap:8px; margin-bottom:8px;}
.radio-label{display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border); border-radius:12px; cursor:pointer; background:var(--surface2);}
.radio-label input[type="radio"]{width:20px; height:20px; accent-color:var(--btn-bg);}
.radio-label span{font-size:15px;}

/* Сетка для карточек персонажей */
.char-grid{display:grid; grid-template-columns:1fr; gap:12px;}
.char-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; cursor:pointer;}
.char-card:active{background:var(--surface2);}
.char-card h4{font-size:18px; margin-bottom:6px; color:var(--accent);}
.char-card p{font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
</style>
</head>
<body>

<!-- ЭКРАН: КАТАЛОГ -->
<div id="screen-catalog" class="screen active">
  <div class="header-bar">
    <h1>𝙆𝙚𝙟𝙟</h1>
    <button class="btn btn-small" onclick="openRoleForm()">+ Ролевая</button>
    <button class="btn btn-secondary btn-small" onclick="openCharMenu()">+ Мой персонаж</button>
    <button class="btn btn-secondary btn-small" onclick="openFolderForm()">+ Папка</button>
    <button class="btn btn-secondary btn-small" onclick="openSettings()">⚙</button>
  </div>
  <input type="text" class="search-bar" id="searchInput" placeholder="Поиск по названию..." oninput="renderCatalog()">
  <div id="foldersContainer" class="folder-grid"></div>
  <div id="rolesContainer" class="role-list"></div>
</div>

<!-- ЭКРАН: ГАЛЕРЕЯ ПЕРСОНАЖЕЙ -->
<div id="screen-chargallery" class="screen">
  <div class="header-bar">
    <button class="btn btn-secondary btn-small" onclick="backToCatalog()">← Назад</button>
    <h2>Галерея персонажей</h2>
    <button class="btn btn-small" onclick="openCharForm()">+ Создать</button>
  </div>
  <div id="charsContainer" class="char-grid"></div>
</div>

<!-- ЭКРАН: ФОРМА ПЕРСОНАЖА -->
<div id="screen-charform" class="screen">
  <div class="header-bar">
    <button class="btn btn-secondary btn-small" onclick="backToCharGallery()">← Назад</button>
    <h2>Мой персонаж</h2>
  </div>
  <div class="form-group"><label>Имя персонажа (обязательно)</label><input id="cfName" placeholder="Например: Аркадий"></div>
  <div class="form-group"><label>Внешность</label><textarea id="cfAppearance" rows="2" placeholder="Описание внешности..."></textarea></div>
  
  <div class="form-group">
    <label>Характер</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="cfCharType" value="prop" onchange="toggleCharField('cfCharacter')"><span>Прописать</span></label>
      <label class="radio-label"><input type="radio" name="cfCharType" value="hide" checked onchange="toggleCharField('cfCharacter')"><span>Раскроется по ходу ролевой</span></label>
    </div>
    <textarea id="cfCharacter" class="hidden" rows="2" placeholder="Опишите характер..."></textarea>
  </div>

  <div class="form-group">
    <label>Биография</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="cfBioType" value="prop" onchange="toggleCharField('cfBio')"><span>Прописать</span></label>
      <label class="radio-label"><input type="radio" name="cfBioType" value="hide" checked onchange="toggleCharField('cfBio')"><span>Раскроется по ходу ролевой</span></label>
    </div>
    <textarea id="cfBio" class="hidden" rows="2" placeholder="Опишите биографию..."></textarea>
  </div>

  <div class="form-group">
    <label>Дополнительно</label>
    <div class="radio-group">
      <label class="radio-label"><input type="radio" name="cfAddType" value="prop" onchange="toggleCharField('cfAdditional')"><span>Прописать</span></label>
      <label class="radio-label"><input type="radio" name="cfAddType" value="hide" checked onchange="toggleCharField('cfAdditional')"><span>Раскроется по ходу ролевой</span></label>
    </div>
    <textarea id="cfAdditional" class="hidden" rows="2" placeholder="Дополнительная информация..."></textarea>
  </div>

  <div class="settings-row">
    <button class="btn" onclick="saveCharacter()">Сохранить</button>
    <button class="btn btn-secondary" onclick="deleteCurrentChar()" id="cfDeleteBtn" style="display:none;">Удалить</button>
  </div>
</div>

<!-- ЭКРАН: ФОРМА РОЛЕВОЙ -->
<div id="screen-roleform" class="screen">
  <div class="header-bar">
    <button class="btn btn-secondary btn-small" onclick="backToCatalog()">← Назад</button>
    <h2 id="roleFormTitle">Новая ролевая</h2>
  </div>
  <div class="form-group"><label>Название</label><input id="rfName" placeholder="Например: Тёмный лес"></div>
  <div class="form-group"><label>Папка</label><select id="rfFolder"></select></div>
  <div class="form-group"><label>Мой персонаж в этой ролевой</label><select id="rfMyChar"></select></div>
  <div class="form-group"><label>Модель по умолчанию</label>
    <div class="model-switch">
      <button type="button" id="btnGemini" onclick="pickModel('gemini')">Gemini</button>
      <button type="button" id="btnDeepseek" onclick="pickModel('deepseek')">DeepSeek</button>
    </div>
  </div>
  <div class="form-group"><label>Желаемая длина поста бота (символов)</label><input id="rfLength" type="number" placeholder="Например: 1100"></div>
  <div class="form-group"><label>Вселенная / окружение</label><textarea id="rfWorld" rows="3" placeholder="Мир, местность, атмосфера..."></textarea></div>
  <div class="form-group"><label>Сюжет / что происходит</label><textarea id="rfPlot" rows="3"></textarea></div>
  <div class="form-group"><label>Детали мира</label><textarea id="rfDetails" rows="3"></textarea></div>
  <div class="form-group"><label>Персонаж бота (характер, описание)</label><textarea id="rfChar" rows="3"></textarea></div>
  <div class="form-group"><label>Второстепенные персонажи (для фона)</label><textarea id="rfSecondary" rows="2" placeholder="Опиши их кратко..."></textarea></div>
  <div class="settings-row">
    <button class="btn" onclick="saveRole()">Сохранить</button>
    <button class="btn btn-secondary" onclick="deleteCurrentRole()" id="rfDeleteBtn" style="display:none;">Удалить</button>
  </div>
</div>

<!-- ЭКРАН: ЧАТ -->
<div id="screen-chat" class="screen">
  <div class="header-bar">
    <button class="btn btn-secondary btn-small" onclick="backToCatalog()">← Назад</button>
    <h2 id="chatTitle">Ролевая</h2>
    <button class="btn btn-secondary btn-small" onclick="toggleNotes()">📝</button>
    <button class="btn btn-secondary btn-small" onclick="editCurrentRole()">✎</button>
  </div>
  <div id="chatMessages" class="chat-messages"></div>
  <div id="notesPanel" class="notes-panel hidden">
    <strong>Блокнот (ключевая информация)</strong>
    <textarea id="notesContent" placeholder="Что бот должен помнить..."></textarea>
    <button class="btn btn-small" style="margin-top:8px;" onclick="saveNotes()">Сохранить заметки</button>
  </div>
  <div class="chat-input-row">
    <textarea class="chat-input" id="chatInput" placeholder="Ваше сообщение..." rows="1"></textarea>
    <button class="btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- ЭКРАН: НАСТРОЙКИ -->
<div id="screen-settings" class="screen">
  <div class="header-bar">
    <button class="btn btn-secondary btn-small" onclick="backToCatalog()">← Назад</button>
    <h2>Настройки</h2>
  </div>

  <h3 style="margin-bottom:12px;font-size:16px;">Общие правила для всех ролевых</h3>
  <div class="form-group">
    <label>Твой глобальный промпт (стиль, длина ответов, правила):</label>
    <textarea id="globalPromptInput" rows="6" placeholder="Пиши развернутые ответы от 1000 символов..."></textarea>
  </div>

  <h3 style="margin-bottom:12px;font-size:16px;">API-ключи</h3>
  <div class="form-group"><label>Gemini API-ключ</label><input id="keyGemini" placeholder="AIza..."></div>
  <div class="form-group"><label>DeepSeek API-ключ</label><input id="keyDeepseek" placeholder="sk-..."></div>
  <div class="switch-row">
    <label>Автопереключение при ошибке модели</label>
    <input type="checkbox" id="autoSwitch">
  </div>
  <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Ключи хранятся только на этом телефоне.</p>

  <h3 style="margin-bottom:12px;font-size:16px;">Цвета интерфейса</h3>
  <div class="color-row"><label>Фон приложения</label><input type="color" id="colBg"></div>
  <div class="color-row"><label>Моё сообщение в чате</label><input type="color" id="colUserMsg"></div>
  <div class="color-row"><label>Текст моих сообщений</label><input type="color" id="colUserText"></div>
  <div class="color-row"><label>Сообщение бота</label><input type="color" id="colBotMsg"></div>
  <div class="color-row"><label>Текст сообщений бота</label><input type="color" id="colBotText"></div>
  <div class="color-row"><label>Фон кнопок</label><input type="color" id="colBtn"></div>
  <div class="color-row"><label>Текст на кнопках</label><input type="color" id="colBtnText"></div>
  <div class="color-row"><label>Строка ввода (фон)</label><input type="color" id="colInputBg"></div>
  <div class="color-row"><label>Строка ввода (текст)</label><input type="color" id="colInputText"></div>
  <div class="color-row"><label>Основной цвет текста</label><input type="color" id="colText"></div>

  <div class="settings-row" style="margin-top:16px;">
    <button class="btn" onclick="saveSettings()">Сохранить всё</button>
    <button class="btn btn-secondary" onclick="resetColors()">Сбросить цвета</button>
  </div>
</div>

<!-- ЭКРАН: ФОРМА ПАПКИ -->
<div id="screen-folderform" class="screen">
  <div class="header-bar">
    <button class="btn btn-secondary btn-small" onclick="backToCatalog()">← Назад</button>
    <h2>Новая папка</h2>
  </div>
  <div class="form-group"><label>Название папки</label><input id="ffName" placeholder="Фэнтези, Sci-Fi..."></div>
  <div class="form-group"><label>Цвет</label><input id="ffColor" type="color" value="#bb86fc" style="height:52px;padding:4px;"></div>
  <button class="btn" onclick="saveFolder()">Сохранить</button>
</div>

<!-- МОДАЛЬНОЕ ОКНО: МЕНЮ ПЕРСОНАЖЕЙ -->
<div id="modalCharMenu" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>Мои персонажи</h3>
    <button onclick="openCharForm()">Создать</button>
    <button onclick="openCharGallery()">Галерея</button>
    <button class="btn-secondary" onclick="document.getElementById('modalCharMenu').classList.add('hidden')" style="text-align:center;margin-top:8px;background:transparent;border:none;">Отмена</button>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ -->
<div id="modalEdit" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>Редактировать сообщение</h3>
    <textarea id="editMsgInput"></textarea>
    <div style="display:flex; gap:10px;">
      <button class="btn" style="flex:1;" onclick="saveEditedMessage()">Сохранить</button>
      <button class="btn btn-secondary" style="flex:1;" onclick="closeEditModal()">Отмена</button>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ПЕРЕДЕЛКИ -->
<div id="modalRework" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>Как переделать пост?</h3>
    <button onclick="doRework('Жестче', 'Сделай ответ грубее и резче, но не нарушай характер персонажа.')">Жестче</button>
    <button onclick="doRework('Намного жестче', 'Сделай ответ гораздо более грубым и агрессивным, но не нарушай характер персонажа.')">Намного жестче</button>
    <button onclick="doRework('Мягче', 'Сделай ответ мягче, нежнее и спокойнее, но не нарушай характер персонажа.')">Мягче</button>
    <button onclick="doRework('Другой', 'Полностью перепиши этот ответ, измени действия и описание персонажа.')">Другой</button>
    <button class="btn-secondary" onclick="closeModal()" style="text-align:center;margin-top:8px;background:transparent;border:none;">Отмена</button>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКОШКО ДЛЯ ПРЕДУПРЕЖДЕНИЙ -->
<div id="modalAlert" class="modal-overlay hidden">
  <div class="modal-content">
    <h3>Внимание</h3>
    <p id="alertText" style="text-align:center; margin-bottom:15px; color:var(--text);"></p>
    <button class="btn" onclick="closeAlert()">Понятно</button>
  </div>
</div>

<script>
// ===== БАЗА ДАННЫХ =====
let db;
const DB_NAME='RoleplayDB', DB_VERSION=2;
function initDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onerror=()=>rej(r.error);r.onsuccess=()=>{db=r.result;res()};r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('roles'))d.createObjectStore('roles',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('messages')){const s=d.createObjectStore('messages',{keyPath:'id',autoIncrement:true});s.createIndex('roleId','roleId',{unique:false})}if(!d.objectStoreNames.contains('notes'))d.createObjectStore('notes',{keyPath:'roleId'});if(!d.objectStoreNames.contains('folders'))d.createObjectStore('folders',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('characters'))d.createObjectStore('characters',{keyPath:'id',autoIncrement:true})}})}
function dbAll(s){return new Promise((res,rej)=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbAdd(s,d){return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');const r=t.objectStore(s).add(d);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbPut(s,d){return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');const r=t.objectStore(s).put(d);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbGet(s,k){return new Promise((res,rej)=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbDel(s,k){return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');const r=t.objectStore(s).delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function dbByIndex(s,i,v){return new Promise((res,rej)=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).index(i).getAll(v);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

// ===== ПЕРЕМЕННЫЕ =====
let currentRoleId=null, allRoles=[], allFolders=[], allChars=[], editingRoleId=null, editingModel='gemini';
let currentCharId=null, editingCharId=null;
let settings={gemini:'',deepseek:'',autoSwitch:false};
let colors={bg:'#121212',userMsg:'#bb86fc',userText:'#000000',botMsg:'#1e1e1e',botText:'#e0e0e0',btn:'#bb86fc',btnText:'#000000',inputBg:'#1e1e1e',inputText:'#e0e0e0',text:'#e0e0e0'};
const defaultColors={...colors};
let reworkMessageId=null;
let editingMessageId=null;

// ===== ОКОШКИ =====
function showAlert(msg) { document.getElementById('alertText').textContent = msg; document.getElementById('modalAlert').classList.remove('hidden'); }
function closeAlert() { document.getElementById('modalAlert').classList.add('hidden'); }

// ===== НАВИГАЦИЯ =====
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function backToCatalog(){showScreen('screen-catalog');renderCatalog()}
function openCharMenu(){ document.getElementById('modalCharMenu').classList.remove('hidden'); }
function openCharGallery(){ document.getElementById('modalCharMenu').classList.add('hidden'); renderCharGallery(); showScreen('screen-chargallery'); }
function backToCharGallery(){ showScreen('screen-chargallery'); renderCharGallery(); }

// ===== ПРИМЕНЕНИЕ ЦВЕТОВ =====
function applyColors(){
  const r=document.documentElement.style;
  r.setProperty('--bg',colors.bg); r.setProperty('--user-msg',colors.userMsg); r.setProperty('--user-msg-text',colors.userText);
  r.setProperty('--bot-msg',colors.botMsg); r.setProperty('--bot-msg-text',colors.botText);
  r.setProperty('--btn-bg',colors.btn); r.setProperty('--btn-text',colors.btnText);
  r.setProperty('--input-bg',colors.inputBg); r.setProperty('--input-text',colors.inputText);
  r.setProperty('--text',colors.text); r.setProperty('--accent',colors.btn);
  document.querySelector('meta[name=theme-color]')?.setAttribute('content',colors.bg);
}

// ===== КАТАЛОГ =====
async function renderCatalog(){
  const term=(document.getElementById('searchInput').value||'').toLowerCase();
  allRoles=await dbAll('roles');allFolders=await dbAll('folders');
  const filtered=allRoles.filter(r=>r.name.toLowerCase().includes(term));
  const fc=document.getElementById('foldersContainer');fc.innerHTML='';
  const groups={};
  filtered.forEach(r=>{const f=r.folder||'Без папки';(groups[f]=groups[f]||[]).push(r)});
  Object.keys(groups).forEach(fname=>{
    const fol=allFolders.find(f=>f.name===fname);
    const color=fol?fol.color:colors.btn;
    const c=document.createElement('div');c.className='folder-card';c.style.borderLeftColor=color;
    c.innerHTML=`<div class="folder-name">${escapeHtml(fname)}</div><div class="folder-count">${groups[fname].length} шт.</div>`;
    fc.appendChild(c);
  });
  const rc=document.getElementById('rolesContainer');rc.innerHTML='';
  filtered.forEach(r=>{
    const fol=allFolders.find(f=>f.name===r.folder);
    const color=fol?fol.color:colors.btn;
    const i=document.createElement('div');i.className='role-item';
    i.innerHTML=`<span>${escapeHtml(r.name)}</span><span style="color:${color};font-size:12px;">${escapeHtml(r.folder||'')} · ${r.model==='deepseek'?'DeepSeek':'Gemini'}</span>`;
    i.onclick=()=>openChat(r.id);rc.appendChild(i);
  });
}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

// ===== ПЕРСОНАЖИ =====
async function renderCharGallery(){
  allChars = await dbAll('characters');
  const c = document.getElementById('charsContainer');
  c.innerHTML = '';
  if(allChars.length === 0) { c.innerHTML = '<p style="color:var(--muted);text-align:center;">Пока нет персонажей...</p>'; return; }
  allChars.forEach(char => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.innerHTML = `<h4>${escapeHtml(char.name)}</h4><p>${escapeHtml(char.appearance || 'Без внешности')}</p>`;
    card.onclick = () => openCharForm(char);
    c.appendChild(card);
  });
}

function toggleCharField(id){
  const el = document.getElementById(id);
  const radios = document.getElementsByName(id.replace('cf','cf')+'Type'); 
  // Простая логика: если выбран "Прописать" - показываем, иначе скрываем
  const selected = document.querySelector(`input[name="${id.replace('cf','cf')}Type"]:checked`);
  if(selected && selected.value === 'prop') el.classList.remove('hidden');
  else el.classList.add('hidden');
}

async function openCharForm(char){
  editingCharId = char ? char.id : null;
  document.getElementById('cfName').value = char ? char.name : '';
  document.getElementById('cfAppearance').value = char ? char.appearance : '';
  
  // Сброс радио-кнопок
  document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
  
  // Характер
  document.getElementById('cfCharacter').value = char ? char.character : '';
  document.getElementById('cfCharacter').classList.add('hidden');
  if(char && char.character) {
    document.querySelector('input[name="cfCharType"][value="prop"]').checked = true;
    document.getElementById('cfCharacter').classList.remove('hidden');
  } else {
    document.querySelector('input[name="cfCharType"][value="hide"]').checked = true;
  }

  // Биография
  document.getElementById('cfBio').value = char ? char.bio : '';
  document.getElementById('cfBio').classList.add('hidden');
  if(char && char.bio) {
    document.querySelector('input[name="cfBioType"][value="prop"]').checked = true;
    document.getElementById('cfBio').classList.remove('hidden');
  } else {
    document.querySelector('input[name="cfBioType"][value="hide"]').checked = true;
  }

  // Дополнительно
  document.getElementById('cfAdditional').value = char ? char.additional : '';
  document.getElementById('cfAdditional').classList.add('hidden');
  if(char && char.additional) {
    document.querySelector('input[name="cfAddType"][value="prop"]').checked = true;
    document.getElementById('cfAdditional').classList.remove('hidden');
  } else {
    document.querySelector('input[name="cfAddType"][value="hide"]').checked = true;
  }

  document.getElementById('cfDeleteBtn').style.display = char ? 'inline-block' : 'none';
  showScreen('screen-charform');
}

async function saveCharacter(){
  const name = document.getElementById('cfName').value.trim();
  if(!name){ showAlert('Заполни имя персонажа!'); return; }

  const charData = {
    name,
    appearance: document.getElementById('cfAppearance').value.trim(),
    character: document.querySelector('input[name="cfCharType"]:checked').value === 'prop' ? document.getElementById('cfCharacter').value.trim() : '',
    bio: document.querySelector('input[name="cfBioType"]:checked').value === 'prop' ? document.getElementById('cfBio').value.trim() : '',
    additional: document.querySelector('input[name="cfAddType"]:checked').value === 'prop' ? document.getElementById('cfAdditional').value.trim() : ''
  };

  if(editingCharId){
    charData.id = editingCharId;
    await dbPut('characters', charData);
  } else {
    await dbAdd('characters', charData);
  }
  backToCharGallery();
}

async function deleteCurrentChar(){
  if(!editingCharId) return;
  if(!confirm('Удалить персонажа?')) return;
  await dbDel('characters', editingCharId);
  backToCharGallery();
}

// ===== ФОРМА РОЛЕВОЙ =====
async function openRoleForm(role){
  editingRoleId=role?role.id:null;
  editingModel=role?role.model:'gemini';
  document.getElementById('roleFormTitle').textContent=role?'Редактировать':'Новая ролевая';
  document.getElementById('rfName').value=role?role.name:'';
  document.getElementById('rfWorld').value=role?role.world||'':'';
  document.getElementById('rfPlot').value=role?role.plot||'':'';
  document.getElementById('rfDetails').value=role?role.details||'':'';
  document.getElementById('rfChar').value=role?role.character||'':'';
  document.getElementById('rfSecondary').value=role?role.secondary||'':'';
  document.getElementById('rfLength').value=role?role.length||'':'';
  document.getElementById('rfDeleteBtn').style.display=role?'inline-block':'none';
  pickModel(editingModel);
  
  allFolders=await dbAll('folders');
  const sel=document.getElementById('rfFolder');sel.innerHTML='<option value="">Без папки</option>';
  allFolders.forEach(f=>{const o=document.createElement('option');o.value=f.name;o.textContent=f.name;if(role&&role.folder===f.name)o.selected=true;sel.appendChild(o)});

  // Заполняем список персонажей
  allChars = await dbAll('characters');
  const selChar = document.getElementById('rfMyChar');
  selChar.innerHTML = '<option value="">Не выбран</option>';
  allChars.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id;
    o.textContent = c.name;
    if(role && role.myCharId == c.id) o.selected = true;
    selChar.appendChild(o);
  });

  showScreen('screen-roleform');
}
function pickModel(m){ editingModel=m; document.getElementById('btnGemini').classList.toggle('selected',m==='gemini'); document.getElementById('btnDeepseek').classList.toggle('selected',m==='deepseek'); }
async function saveRole(){
  const data={
    name:document.getElementById('rfName').value.trim(), folder:document.getElementById('rfFolder').value, model:editingModel,
    myCharId: document.getElementById('rfMyChar').value,
    length:document.getElementById('rfLength').value, world:document.getElementById('rfWorld').value, plot:document.getElementById('rfPlot').value,
    details:document.getElementById('rfDetails').value, character:document.getElementById('rfChar').value, secondary:document.getElementById('rfSecondary').value
  };
  if(!data.name){ showAlert('Введите название!'); return; }
  if(editingRoleId){data.id=editingRoleId;await dbPut('roles',data)}else{data.createdAt=Date.now();await dbAdd('roles',data)}
  backToCatalog();
}
async function deleteCurrentRole(){if(!editingRoleId)return;if(!confirm('Удалить ролевую?'))return;await dbDel('roles',editingRoleId);backToCatalog()}
function editCurrentRole(){const r=allRoles.find(x=>x.id===currentRoleId);if(r)openRoleForm(r)}

// ===== НАСТРОЙКИ =====
async function openSettings(){
  const s=await dbGet('notes','__settings__'); if(s){settings={gemini:s.gemini||'',deepseek:s.deepseek||'',autoSwitch:!!s.autoSwitch}}
  const c=await dbGet('notes','__colors__'); if(c){colors={...defaultColors,...c.colors}}
  const gp=await dbGet('notes','__global_prompt__');
  
  document.getElementById('keyGemini').value=settings.gemini;
  document.getElementById('keyDeepseek').value=settings.deepseek;
  document.getElementById('autoSwitch').checked=settings.autoSwitch;
  document.getElementById('globalPromptInput').value=gp?gp.content:'';
  
  document.getElementById('colBg').value=colors.bg; document.getElementById('colUserMsg').value=colors.userMsg;
  document.getElementById('colUserText').value=colors.userText; document.getElementById('colBotMsg').value=colors.botMsg;
  document.getElementById('colBotText').value=colors.botText; document.getElementById('colBtn').value=colors.btn;
  document.getElementById('colBtnText').value=colors.btnText; document.getElementById('colInputBg').value=colors.inputBg;
  document.getElementById('colInputText').value=colors.inputText; document.getElementById('colText').value=colors.text;
  showScreen('screen-settings');
}
async function saveSettings(){
  settings.gemini=document.getElementById('keyGemini').value.trim();
  settings.deepseek=document.getElementById('keyDeepseek').value.trim();
  settings.autoSwitch=document.getElementById('autoSwitch').checked;
  await dbPut('notes',{roleId:'__settings__',...settings});

  const gpText=document.getElementById('globalPromptInput').value.trim();
  await dbPut('notes',{roleId:'__global_prompt__',content:gpText});

  colors={
    bg:document.getElementById('colBg').value, userMsg:document.getElementById('colUserMsg').value,

    inputText:document.getElementById('colInputText').value, text:document.getElementById('colText').value
  };
  await dbPut('notes',{roleId:'__colors__',colors});
  applyColors(); showAlert('Настройки сохранены!'); backToCatalog();
}
async function resetColors(){ colors={...defaultColors}; applyColors(); await dbPut('notes',{roleId:'__colors__',colors}); showAlert('Цвета сброшены'); openSettings(); }

// ===== ЧАТ =====
async function openChat(id){
  currentRoleId=id;const r=allRoles.find(x=>x.id===id);
  document.getElementById('chatTitle').textContent=r?r.name:'';
  showScreen('screen-chat');await loadMessages(id);await loadNotes(id);
  document.getElementById('chatInput').focus();
}
async function loadMessages(id){
  const msgs=await dbByIndex('messages','roleId',id);const c=document.getElementById('chatMessages');c.innerHTML='';
  msgs.sort((a,b)=>a.timestamp-b.timestamp).forEach(m=>{
    const container=document.createElement('div'); container.className='msg-container '+m.sender;
    const d=document.createElement('div');d.className='msg '+m.sender;d.textContent=m.text;
    container.appendChild(d);
    
    const actions=document.createElement('div'); actions.className='msg-actions';
    if(m.sender==='user'){
      const btnEdit=document.createElement('button'); btnEdit.textContent='✎'; btnEdit.onclick=()=>editUserMessage(m.id, m.text);
      actions.appendChild(btnEdit);
    } else if(m.sender==='bot'){
      const btnRework=document.createElement('button'); btnRework.textContent='↻'; btnRework.onclick=()=>openReworkModal(m.id);
      actions.appendChild(btnRework);
    }
    container.appendChild(actions);
    c.appendChild(container);
  });
  c.scrollTop=c.scrollHeight;
}

// Редактирование своих сообщений
function editUserMessage(id, oldText){
  editingMessageId = id;
  const ta = document.getElementById('editMsgInput');
  ta.value = oldText;
  document.getElementById('modalEdit').classList.remove('hidden');
  setTimeout(()=>{ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 300) + 'px'; }, 50);
}
function closeEditModal(){ document.getElementById('modalEdit').classList.add('hidden'); editingMessageId = null; }
async function saveEditedMessage(){
  const newText = document.getElementById('editMsgInput').value.trim();
  if(!newText || !editingMessageId) return closeEditModal();
  
  const msgs = await dbByIndex('messages','roleId',currentRoleId);
  const allSorted = msgs.sort((a,b)=>a.timestamp-b.timestamp);
  const targetIndex = allSorted.findIndex(m => m.id === editingMessageId);
  
  if(targetIndex === -1) return closeEditModal();

  for(let i = targetIndex; i < allSorted.length; i++){
    await dbDel('messages', allSorted[i].id);
  }
  
  await dbAdd('messages',{roleId:currentRoleId,sender:'user',text:newText,timestamp:Date.now()});
  closeEditModal();
  await loadMessages(currentRoleId);
  await generateBotReply(); 
}

// Переделка постов бота
function openReworkModal(msgId){ reworkMessageId=msgId; document.getElementById('modalRework').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modalRework').classList.add('hidden'); }

async function doRework(type, instruction){
  closeModal();
  const r=allRoles.find(x=>x.id===currentRoleId); if(!r) return;
  const key=(r.model==='deepseek')?settings.deepseek:settings.gemini; if(!key) return showAlert('Введите ключ в Настройках (⚙)');
  
  const msgs = await dbByIndex('messages','roleId',currentRoleId);
  const sorted = msgs.sort((a,b)=>a.timestamp-b.timestamp);
  const targetIdx = sorted.findIndex(m => m.id === reworkMessageId);
  const oldBotMsg = sorted[targetIdx];
  
  await dbDel('messages', reworkMessageId);
  await loadMessages(currentRoleId);
  
  const startIdx = Math.max(0, targetIdx - 8);
  const contextMsgs = sorted.slice(startIdx, targetIdx);
  
  const c=document.getElementById('chatMessages');const wait=document.createElement('div');wait.className='msg bot';wait.textContent='…';wait.id='waitMsg';c.appendChild(wait);c.scrollTop=c.scrollHeight;

  try {
    const reply = await callAI(r, contextMsgs, `ПЕРЕДЕЛАЙ СВОЙ ПРЕДЫДУЩИЙ ОТВЕТ. Старый текст: "${oldBotMsg.text}". Инструкция: ${instruction}`, key);
    document.getElementById('waitMsg')?.remove();
    await dbAdd('messages',{roleId:currentRoleId,sender:'bot',text:reply,timestamp:Date.now()});
    await loadMessages(currentRoleId);
  } catch(e) {
    document.getElementById('waitMsg')?.remove(); showAlert('Ошибка: '+e.message);
  }
}

// Отправка сообщения
async function sendMessage(){
  const inp=document.getElementById('chatInput');const text=inp.value.trim();if(!text||!currentRoleId)return;
  await dbAdd('messages',{roleId:currentRoleId,sender:'user',text,timestamp:Date.now()});
  inp.value='';inp.style.height='auto';await loadMessages(currentRoleId);
  await generateBotReply();
}

async function generateBotReply(){
  const r=allRoles.find(x=>x.id===currentRoleId); if(!r){showAlert('Ролевая не найдена');return}
  const key=(r.model==='deepseek')?settings.deepseek:settings.gemini;
  if(!key){showAlert('Введите ключ в Настройках (⚙)');return}
  
  const c=document.getElementById('chatMessages');const wait=document.createElement('div');wait.className='msg bot';wait.textContent='…';wait.id='waitMsg';c.appendChild(wait);c.scrollTop=c.scrollHeight;
  
  try{
    const msgs = await dbByIndex('messages','roleId',currentRoleId);
    const sorted = msgs.sort((a,b)=>a.timestamp-b.timestamp);
    const last8 = sorted.slice(-8);
    
    let reply = await callAI(r, last8, null, key);
    document.getElementById('waitMsg')?.remove();
    await dbAdd('messages',{roleId:currentRoleId,sender:'bot',text:reply,timestamp:Date.now()});
    await loadMessages(currentRoleId);
  }catch(e){
    document.getElementById('waitMsg')?.remove(); showAlert('Ошибка: '+e.message);
  }
}

async function callAI(role, contextMsgs, extraInstruction, key){
  const notes=await dbGet('notes',role.id);
  const mem=notes?notes.content:'';
  const gpData=await dbGet('notes','__global_prompt__');
  const globalPrompt=gpData?gpData.content:'';

  let lengthRule = '';
  if(role.length) {
    const len = parseInt(role.length);
    lengthRule = `\nВАЖНОЕ ПРАВИЛО ДЛИНЫ: Пиши пост объемом примерно ${len} символов (отклонение не более 100 символов).`;
  }

  let secondaryRule = '';
  if(role.secondary) {
    secondaryRule = `\nВторостепенные персонажи (используй для фона, не перетягивай на них внимание): ${role.secondary}`;
  }

  // Формируем карточку МОЕГО персонажа
  let myCharRule = '';
  if(role.myCharId) {
    const myChar = allChars.find(c => c.id == role.myCharId);
    if(myChar) {
      myCharRule = `\n--- ТВОЙ ПЕРСОНАЖ (ИГРОКА) ---\nИмя: ${myChar.name}\nВнешность: ${myChar.appearance||'не указана'}\n`;
      if(myChar.character) myCharRule += `Характер: ${myChar.character}\n`;
      if(myChar.bio) myCharRule += `Биография: ${myChar.bio}\n`;
      if(myChar.additional) myCharRule += `Дополнительно: ${myChar.additional}\n`;
      myCharRule += `ВНИМАНИЕ: Этот персонаж принадлежит игроку. КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО описывать его действия, мысли или эмоции без прямого указания игрока.`;
    }
  }

  const sys = `${globalPrompt}
--- ДАННЫЕ РОЛЕВОЙ ---
Вселенная: ${role.world||'не указана'}
Сюжет: ${role.plot||'не указан'}
Детали мира: ${role.details||'не указаны'}
Главный персонаж (твой, NPC): ${role.character||'не указан'}${secondaryRule}
${myCharRule}
Память (важное): ${mem||'пока пусто'}${lengthRule}
${extraInstruction ? `\nСПЕЦИАЛЬНАЯ ИНСТРУКЦИЯ: ${extraInstruction}` : ''}`;

  const formattedMsgs = contextMsgs.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }));

  if(role.model==='deepseek'){
    const res=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'deepseek-flash',messages:[{role:'system',content:sys},...formattedMsgs],temperature:1.0})});
    if(!res.ok)throw new Error('DeepSeek: '+res.status);
    const j=await res.json();return j.choices[0].message.content;
  }else{
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:formattedMsgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}))})});
    if(!res.ok)throw new Error('Gemini: '+res.status);
    const j=await res.json();return j.candidates[0].content.parts[0].text;
  }
}
